{% extends "base.html" %}

{% block title %}
Your Cart | EarthlyHerbel
{% endblock %}

{% block content %}

<section class="cart-page">

    <div class="container">

        <div class="section-heading">
            <p class="eyebrow">Your shopping bag</p>

            <h1>Your Cart</h1>

            <p>
                Review your selected products before checkout.
            </p>
        </div>

        <div id="cart-container"></div>

    </div>

</section>


<script>

const cartContainer = document.getElementById("cart-container");

let cart = JSON.parse(
    localStorage.getItem("earthlyHerbelCart")
) || [];


function renderCart() {

    if (cart.length === 0) {

        cartContainer.innerHTML = `
            <div class="empty-cart">

                <h2>Your cart is empty</h2>

                <p>
                    Add some products to begin your EarthlyHerbel ritual.
                </p>

                <a
                    href="{{ url_for('main.shop') }}"
                    class="button button-primary"
                >
                    Continue Shopping
                </a>

            </div>
        `;

        return;
    }


    let subtotal = 0;

    let itemsHTML = "";


    cart.forEach(item => {

        const itemTotal = item.price * item.quantity;

        subtotal += itemTotal;


        itemsHTML += `

            <div class="cart-item">

                <div class="cart-item-info">

                    <h2>
                        ${item.name}
                    </h2>

                    <p>
                        ₹${item.price}
                    </p>

                </div>


                <div class="cart-item-quantity">

                    <button
                        type="button"
                        onclick="changeQuantity(${item.id}, -1)"
                    >
                        −
                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button
                        type="button"
                        onclick="changeQuantity(${item.id}, 1)"
                    >
                        +
                    </button>

                </div>


                <div class="cart-item-total">

                    ₹${itemTotal}

                </div>


                <button
                    type="button"
                    class="remove-item"
                    onclick="removeItem(${item.id})"
                >
                    Remove
                </button>

            </div>

        `;

    });


    const delivery = subtotal >= 999 ? 0 : 50;

    const total = subtotal + delivery;


    cartContainer.innerHTML = `

        <div class="cart-layout">

            <div class="cart-items">

                ${itemsHTML}

            </div>


            <div class="cart-summary">

                <h2>
                    Order Summary
                </h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹${subtotal}</span>
                </div>


                <div class="summary-row">
                    <span>Delivery</span>
                    <span>
                        ${delivery === 0 ? "Free" : "₹" + delivery}
                    </span>
                </div>


                <div class="summary-total">

                    <span>Total</span>

                    <strong>
                        ₹${total}
                    </strong>

                </div>


                <button
                    type="button"
                    class="button button-primary checkout-button"
                >
                    Proceed to Checkout
                </button>

            </div>

        </div>

    `;

}


function changeQuantity(productId, change) {

    const item = cart.find(
        product => product.id === productId
    );

    if (!item) {
        return;
    }


    item.quantity += change;


    if (item.quantity <= 0) {

        cart = cart.filter(
            product => product.id !== productId
        );

    }


    localStorage.setItem(
        "earthlyHerbelCart",
        JSON.stringify(cart)
    );
    updateCartCount();


    renderCart();

}


function removeItem(productId) {

    cart = cart.filter(
        product => product.id !== productId
    );


    localStorage.setItem(
        "earthlyHerbelCart",
        JSON.stringify(cart)
    );
    updateCartCount();


    renderCart();

}


renderCart();

</script>

{% endblock %}
