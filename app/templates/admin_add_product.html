{% extends "base.html" %}

{% block title %}
Add Product | EarthlyHerbel
{% endblock %}

{% block content %}

<section class="admin-page">

    <div class="container">

        <div class="section-heading">

            <p class="eyebrow">
                Admin Portal
            </p>

            <h1>
                Add Product
            </h1>

            <p>
                Add a new product to the EarthlyHerbel catalogue.
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('main.admin_add_product') }}"
            class="admin-product-form"
        >

            <div class="form-group">

                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    placeholder="Example: Neem Hair Serum"
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                    <option value="Haircare">
                        Haircare
                    </option>

                    <option value="Skincare">
                        Skincare
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="price">
                    Selling Price (₹)
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    step="0.01"
                    required
                    placeholder="399"
                >

            </div>


            <div class="form-group">

                <label for="original_price">
                    Original Price (₹)
                </label>

                <input
                    type="number"
                    id="original_price"
                    name="original_price"
                    min="0"
                    step="0.01"
                    required
                    placeholder="499"
                >

            </div>


            <div class="form-group">

                <label for="rating">
                    Rating
                </label>

                <input
                    type="number"
                    id="rating"
                    name="rating"
                    min="0"
                    max="5"
                    step="0.1"
                    value="0"
                >

            </div>


            <div class="form-group">

                <label for="stock">
                    Stock Quantity
                </label>

                <input
                    type="number"
                    id="stock"
                    name="stock"
                    min="0"
                    value="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    required
                    placeholder="Describe the product..."
                ></textarea>

            </div>


            <div class="form-group">

                <label for="ingredients">
                    Ingredients
                </label>

                <textarea
                    id="ingredients"
                    name="ingredients"
                    rows="4"
                    placeholder="Example: Neem, Aloe Vera, Coconut Oil"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="benefits">
                    Benefits
                </label>

                <textarea
                    id="benefits"
                    name="benefits"
                    rows="4"
                    placeholder="Benefit 1 | Benefit 2 | Benefit 3"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="how_to_use">
                    How to Use
                </label>

                <textarea
                    id="how_to_use"
                    name="how_to_use"
                    rows="4"
                    placeholder="Explain how the customer should use the product..."
                ></textarea>

            </div>


            <div class="admin-form-actions">

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Add Product
                </button>

                <a
                    href="{{ url_for('main.admin_dashboard') }}"
                    class="button button-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
