<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="EarthlyHerbel - Naturally rooted haircare and skincare."
    >

    <title>{% block title %}EarthlyHerbel{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <div class="container navbar">

            <!-- Brand -->
            <a
                href="{{ url_for('main.home') }}"
                class="brand"
            >
                EarthlyHerbel
            </a>

            <!-- Desktop Navigation -->
            <nav class="nav-links">

                <a href="{{ url_for('main.home') }}">
                    Home
                </a>

                <a href="#">
                    Haircare
                </a>

                <a href="#">
                    Skincare
                </a>

                <a href="#">
                    About
                </a>

                <a href="#">
                    Contact
                </a>

            </nav>

            <!-- Actions -->
            <div class="nav-actions">

                <a href="#" aria-label="Search">
                    Search
                </a>

                <a href="#" aria-label="Shopping cart">
                    Cart (0)
                </a>

            </div>

            <!-- Mobile Menu Button -->
            <button
                class="mobile-menu-button"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                id="mobile-menu-button"
            >
                ☰
            </button>

        </div>

        <!-- Mobile Navigation -->
        <nav class="mobile-nav" id="mobile-nav">

            <a href="{{ url_for('main.home') }}">
                Home
            </a>

            <a href="#">
                Haircare
            </a>

            <a href="#">
                Skincare
            </a>

            <a href="#">
                About
            </a>

            <a href="#">
                Contact
            </a>

            <a href="#">
                Search
            </a>

            <a href="#">
                Cart (0)
            </a>

        </nav>

    </header>


    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 EarthlyHerbel. All rights reserved.
            </p>

        </div>

    </footer>

    <!-- JavaScript -->
    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>

</body>

</html>
