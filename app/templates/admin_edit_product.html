{% extends "base.html" %}

{% block title %}
Edit Product | EarthlyHerbel
{% endblock %}

{% block content %}

<section class="admin-page">

    <div class="container">

        <div class="section-heading">

            <p class="eyebrow">
                Admin Portal
            </p>

            <h1>
                Edit Product
            </h1>

            <p>
                Update product information and stock.
            </p>

        </div>


        <form
            method="POST"
            action="{{ url_for('main.admin_edit_product', product_id=product[0]) }}"
            class="admin-product-form"
        >

            <div class="form-group">

                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ product[1] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option
                        value="Haircare"
                        {% if product[2] == "Haircare" %}
                        selected
                        {% endif %}
                    >
                        Haircare
                    </option>

                    <option
                        value="Skincare"
                        {% if product[2] == "Skincare" %}
                        selected
                        {% endif %}
                    >
                        Skincare
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="price">
                    Selling Price (₹)
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    value="{{ product[3] }}"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-group">

                <label for="original_price">
                    Original Price (₹)
                </label>

                <input
                    type="number"
                    id="original_price"
                    name="original_price"
                    value="{{ product[4] }}"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <div class="form-group">

                <label for="rating">
                    Rating
                </label>

                <input
                    type="number"
                    id="rating"
                    name="rating"
                    value="{{ product[5] }}"
                    min="0"
                    max="5"
                    step="0.1"
                >

            </div>


            <div class="form-group">

                <label for="stock">
                    Stock Quantity
                </label>

                <input
                    type="number"
                    id="stock"
                    name="stock"
                    value="{{ product[6] }}"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    required
                >{{ product[7] }}</textarea>

            </div>


            <div class="form-group">

                <label for="ingredients">
                    Ingredients
                </label>

                <textarea
                    id="ingredients"
                    name="ingredients"
                    rows="4"
                >{{ product[8] }}</textarea>

            </div>


            <div class="form-group">

                <label for="benefits">
                    Benefits
                </label>

                <textarea
                    id="benefits"
                    name="benefits"
                    rows="4"
                >{{ product[9] }}</textarea>

            </div>


            <div class="form-group">

                <label for="how_to_use">
                    How to Use
                </label>

                <textarea
                    id="how_to_use"
                    name="how_to_use"
                    rows="4"
                >{{ product[10] }}</textarea>

            </div>


            <div class="admin-form-actions">

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Save Changes
                </button>

                <a
                    href="{{ url_for('main.admin_dashboard') }}"
                    class="button button-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
